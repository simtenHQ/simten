<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circuit Embed E2E Test</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/circuit-embed.js"></script>
  <style>
    body { background: #0a0a0a; color: white; font-family: sans-serif; padding: 20px; }
    .test-section { margin-bottom: 40px; }
    h2 { font-size: 14px; color: #888; margin-bottom: 8px; }
  </style>
</head>
<body>
  <!-- Test 1: Basic circuit-embed -->
  <div class="test-section" id="test-basic">
    <h2>Test: Basic Embed</h2>
    <circuit-embed
      code="import { circuit, bit } from '@turing-incomplete/core/circuit';
import { Switch, Xor, Led } from '@turing-incomplete/core/std';

const HalfAdder = circuit('HalfAdder', {
  nodes: { A: Switch, B: Switch, gate: Xor, light: Led },
  connect: ({ A, B, gate, light }) => [
    A.out.to(gate.a),
    B.out.to(gate.b),
    gate.out.to(light.in),
  ],
});"
      height="250"
      title="Half Adder Test"
    ></circuit-embed>
  </div>

  <!-- Test 2: Invalid code (should show error) -->
  <div class="test-section" id="test-error">
    <h2>Test: Error Handling</h2>
    <circuit-embed
      code="this is invalid code"
      height="200"
    ></circuit-embed>
  </div>

  <!-- Test 3: Second instance (isolation) -->
  <div class="test-section" id="test-isolation">
    <h2>Test: Multi-Instance Isolation</h2>
    <circuit-embed
      code="import { circuit } from '@turing-incomplete/core/circuit';
import { Switch, Led } from '@turing-incomplete/core/std';

const Toggle = circuit('Toggle', {
  nodes: { sw: Switch, led: Led },
  connect: ({ sw, led }) => [
    sw.out.to(led.in),
  ],
});"
      height="200"
    ></circuit-embed>
  </div>

</body>
</html>
