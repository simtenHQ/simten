<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Circuit Embed E2E Test</title>
  <link rel="stylesheet" href="/styles.css">
  <script src="/circuit-embed.js"></script>
  <style>
    body { background: #0a0a0a; color: white; font-family: sans-serif; padding: 20px; }
    .test-section { margin-bottom: 40px; }
    h2 { font-size: 14px; color: #888; margin-bottom: 8px; }
  </style>
</head>
<body>
  <!-- Test 1: Basic circuit-embed -->
  <div class="test-section" id="test-basic">
    <h2>Test: Basic Embed</h2>
    <circuit-embed
      code="const HalfAdder = circuit('HalfAdder', {
  inputs: { a: bit, b: bit },
  outputs: { sum: bit, carry: bit },
  nodes: { xor1: Xor, and1: And },
  connect: ({ inputs, outputs, nodes: { xor1, and1 } }) => [
    inputs.a.to(xor1.a, and1.a),
    inputs.b.to(xor1.b, and1.b),
    xor1.out.to(outputs.sum),
    and1.out.to(outputs.carry),
  ],
})"
      height="250"
      title="Half Adder Test"
    ></circuit-embed>
  </div>

  <!-- Test 2: Invalid code (should show error) -->
  <div class="test-section" id="test-error">
    <h2>Test: Error Handling</h2>
    <circuit-embed
      code="this is invalid code"
      height="200"
    ></circuit-embed>
  </div>

  <!-- Test 3: Second instance (isolation) -->
  <div class="test-section" id="test-isolation">
    <h2>Test: Multi-Instance Isolation</h2>
    <circuit-embed
      code="const Toggle = circuit('Toggle', {
  inputs: { sw: bit },
  outputs: { led: bit },
  nodes: { not1: Not },
  connect: ({ inputs, outputs, nodes: { not1 } }) => [
    inputs.sw.to(not1.in),
    not1.out.to(outputs.led),
  ],
})"
      height="200"
    ></circuit-embed>
  </div>
</body>
</html>
