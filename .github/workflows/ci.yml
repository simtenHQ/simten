name: CI

# Every workspace test suite, the Go container tests, typecheck, lint,
# package builds, the web build, and the CircuitEmbed and sandbox browser
# tests.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: tests, workspace build, web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version inferred from `packageManager` in package.json
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Icarus Verilog
        # For core's differential test (simulator vs iverilog on the exported
        # Verilog). The test fails rather than skips when CI is set and
        # iverilog is missing.
        run: sudo apt-get update && sudo apt-get install -y iverilog && iverilog -V | head -1

      - name: Lint & format check (Biome)
        # Runs the pinned @simten/biome devDep (not the setup-biome action) so
        # CI uses the exact version in package.json — a floating "latest" could
        # reformat differently than contributors' local runs. `biome ci` is the
        # CI-tuned entry point (no writes, GitHub annotations). Only errors fail
        # the build; the pre-existing lint/a11y findings are warnings today (see
        # biome.json) and are tracked for incremental cleanup.
        run: pnpm biome ci

      - name: Complexity ratchet
        # Functions over Biome's cognitive complexity limit (25, tests excluded)
        # are listed in scripts/complexity-baseline.txt. Fails on a new one, and
        # on a stale entry so a refactor lowers the baseline in the same PR.
        run: pnpm check-complexity

      - name: Generate Cloudflare worker types
        # `worker-configuration.d.ts` is gitignored (auto-generated by
        # wrangler from each app's wrangler.jsonc) but is referenced by
        # the Cloudflare apps' tsconfigs. Generate before typecheck.
        run: |
          for d in apps/web apps/compiler apps/synth apps/verifier apps/embed-page; do
            (cd "$d" && pnpm exec wrangler types) || exit 1
          done

      - name: Build workspace packages
        # Must run before Typecheck: @simten/mcp has a `composite` project
        # reference to @simten/core, so its tsc invocation expects core's
        # `dist/*.d.ts` to already exist. Locally these dists persist
        # between runs; on a fresh CI checkout they don't.
        #
        # @simten/web also imports `@simten/core/circuit` and `@simten/react`
        # via their `exports` map → `./dist/...`, so the web build needs
        # this too.
        #
        # `--workspace-concurrency=1` forces sequential builds so @simten/mcp
        # doesn't race ahead of @simten/core. pnpm doesn't enforce topological
        # ordering for `run` scripts by default — see issue tracker for plans
        # to evaluate turbo / nx / lage as a proper build orchestrator.
        run: pnpm --filter "./packages/*" --workspace-concurrency=1 build

      - name: Publish-readiness lint (publint)
        # Validates each publishable package's package.json shape against
        # the built dist/: exports paths resolve to real files, types
        # entries are correct, no deprecated patterns. Catches the
        # "publishConfig says ./dist/foo.js but dist/foo.js doesn't exist"
        # class of bug, which is exactly what surfaced for the embed package
        # when CircuitViewer.tsx had a type error blocking the build.
        # Runs after the workspace build (publint reads dist/) and pairs
        # with the build because it's checking the produced artifact.
        #
        # arethetypeswrong/cli is the natural companion check (types
        # resolve correctly in CJS/ESM/bundler/Node10 modes) but current
        # attw versions are broken by fflate@0.8.3 — attw's tarball
        # extractor uses fflate's streaming Gunzip incorrectly (overwrites
        # on each callback instead of concatenating), so the trailing
        # empty-flush chunk fflate started emitting in 0.8.3 clobbers the
        # decompressed data and every tarball comes out empty.
        # Upstream: issue #258, fix #263 merged but not yet released —
        # https://github.com/arethetypeswrong/arethetypeswrong.github.io/pull/263
        # Re-enable here once a new attw release ships.
        run: |
          for pkg in core sandbox react mcp; do
            pnpm dlx publint "packages/$pkg"
          done

      - name: Exports drift check
        # Guards the dev/publish export duality: every package's `exports`
        # points at ./src/*.ts for local dev while `publishConfig.exports`
        # points at ./dist/*.js. A subpath added to one and not the other
        # works in-repo and 404s for anyone installing from npm. This is the
        # first thing root `pnpm test` runs, but CI runs the per-package test
        # scripts directly, so it needs its own step.
        run: pnpm check-exports

      - name: Synth request-size drift check
        # The Hono gateway (apps/synth/src/index.ts) fronts the Go container
        # (container_src/main.go) and both cap the request body, so the smaller
        # limit silently binds. A 130 KB multi-file Verilog import passed every
        # container check and 413'd at the gateway — invisible in local dev,
        # which POSTs to the container directly.
        run: pnpm check-synth-limits

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        # Every workspace package with a `test` script, including the RV32I
        # ISA suite in hardware/ulx3s. The root `pnpm test` also runs the two
        # drift checks, which have their own steps above.
        run: pnpm -r test

      - name: Hardware Snake checks
        # The FPGA Snake played against a reference model, a check that every
        # copy of SnakeCore in the repo matches the one that ships to the
        # board, the editor's playable harness, and a fault-injection check
        # that the gameplay testbench catches known bugs. About 3 seconds.
        # Not part of the package's `test` script, so nothing ran them and two
        # broke silently in #479.
        run: pnpm --filter @simten/hardware-ulx3s verify:snake

      - name: Simulator fingerprints
        # Hash of the full simulator state after N ticks of each bundled
        # example, against packages/core/bench/baseline.json. A change means
        # simulation results changed; if that's intended, rerun
        # `pnpm bench --update` and say why in the PR. Speed isn't checked here.
        run: pnpm bench --check

      - name: FPGA netlist byte-identity guard
        # Locks the synthesized RV32I_CPU_Core netlist (the flat IR fed to the
        # Verilog exporter — pre-codegen, so stable against exporter/toolchain
        # churn) against the committed golden. Catches any edit to the shared
        # @simten/core RV32I_Core that silently perturbs the FPGA design.
        # Updating the golden is gated on a real board re-verify — see
        # hardware/ulx3s/projects/cpu/GOLDEN.md.
        #
        # ┌──────────────────────────────────────────────────────────────────┐
        # │ TEMPORARILY NON-BLOCKING. RESTORE BY DELETING continue-on-error. │
        # └──────────────────────────────────────────────────────────────────┘
        # The bus-width work changed six BitSlice nodes' declared widths in the
        # CPU, so the netlist drifted by design: same 118 nodes and 271
        # connections, six gaining an explicit `width` argument and six
        # connections declaring their true width instead of a fictitious bus(8).
        # The exported Verilog was cross-checked against the TS simulator under
        # Icarus Verilog (`pnpm fpga:verify --suite`, 69/69 match, 0 divergent),
        # but no board was available to complete the GOLDEN.md ritual, which is
        # the only thing that certifies synthesis and timing.
        #
        # The step still runs and still prints the drift, it just does not fail
        # the build. Regenerating the golden to go green instead would destroy
        # what the golden certifies, which GOLDEN.md explicitly forbids.
        continue-on-error: true
        run: pnpm fpga:netlist-check

      - name: Build web app
        # Cloudflare API creds are required for the prerender step — the
        # Cloudflare vite plugin spins up a preview server at build time.
        # Locally these come from .env via dotenv-cli; in CI they come from
        # GitHub Actions secrets (Settings → Secrets and variables → Actions).
        #
        # Skipped for Dependabot: GitHub deliberately withholds Actions secrets
        # from Dependabot-triggered runs (they see only the separate Dependabot
        # secrets store), so both vars arrive empty, the preview server can't
        # start, and the step fails with "Failed to start the Vite preview
        # server for prerendering" — on every dependency bump, regardless of
        # what was bumped. Mirroring the creds into Dependabot secrets would fix
        # the symptom but hand Cloudflare credentials to auto-generated PRs,
        # which is the exposure CONTRIBUTING's fork-PR threat model warns about.
        # Everything that actually vets a dependency bump — Biome, typecheck,
        # exports drift, core/ui tests, the FPGA suite and netlist guard — still
        # runs. Web-build coverage returns the moment the bump lands on main.
        if: github.actor != 'dependabot[bot]'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: pnpm --filter @simten/web build

  e2e:
    name: browser tests (CircuitEmbed, sandbox)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        # Headless shell only, and no `--with-deps`: the runner image already
        # has the system libraries, and installing them through apt took four
        # of this job's five minutes.
        run: pnpm exec playwright install --only-shell chromium

      - name: Build core, sandbox and react
        # Built before the Playwright suites, one at a time, in dependency
        # order (see the workspace build above).
        run: |
          pnpm --filter @simten/core build
          pnpm --filter @simten/sandbox build
          pnpm --filter @simten/react build

      - name: CircuitEmbed (Playwright)
        # Builds the sandbox and a fixture page of <CircuitEmbed>s pointed at
        # it, then runs the suite against both, so it tests this commit's
        # sandbox rather than the deployed one.
        run: pnpm --filter @simten/react test:e2e

      - name: Sandbox watchdog
        # An infinite loop in user code times out, the page stays responsive,
        # and the next compile works.
        run: pnpm --filter @simten/sandbox-app test:e2e

  go:
    name: container tests (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        app: [compiler, synth, verifier]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}/container_src
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: apps/${{ matrix.app }}/container_src/go.mod
          cache: false

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...
