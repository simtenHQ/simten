name: CI

# CI is intentionally scoped to the parts of the workspace that are
# currently green end-to-end. See the "Deferred coverage" notes below
# for what we want to add once the underlying issues are fixed.
#
# What runs today:
#   1. pnpm install (frozen lockfile)
#   2. @simten/core unit tests              — 389 tests, the load-bearing
#                                              simulator + circuit IR + std lib
#                                              + verilog exporter
#   3. @simten/ui unit tests                 — 82 tests across editor stores,
#                                              circuit flattener, vcd generator
#                                              (14 quarantined; need porting to
#                                              the post-refactor evaluator API)
#   4. workspace package builds              — sequential `tsc -b` + vite for
#                                              core/ui/embed/mcp
#   5. web production build                  — proves the web app + Cloudflare
#                                              Workers bundle compiles end to end
#
# Deferred coverage (TODO before this is "real" CI):
#
#   • Workspace-wide `tsc --noEmit`
#       Status: 208 pre-existing TS errors across core, embed, ui, and
#       apps/tanstack/src/features/blog/. Mostly TS6133 unused-locals noise,
#       plus a handful of real type mismatches in:
#         - packages/embed/src/auto-harness.ts        (PortInstance shape drift)
#         - packages/ui/src/editor/types/index.ts     (CircuitKind not exported)
#         - packages/ui/src/editor/types/ui-model.ts  (type predicate mismatch)
#       Fix path: clean the unused-var warnings (mechanical), then resolve the
#       three real shape mismatches, then add `pnpm -r exec tsc --noEmit` here.
#
#   • apps/tanstack vitest tests
#       Status: vitest startup crashes with
#         ReferenceError: module is not defined at tiny-warning.cjs.js:22
#       Root cause: tanstack's vitest config uses @cloudflare/vitest-pool-workers
#       (Workerd runtime, strict ESM-only). A transitive CJS dependency
#       (`tiny-warning`, pulled in by react-router/radix) escapes vite's
#       optimizer and crashes the worker. Fix path is one of:
#         a) switch the default pool to "forks" and reserve the workers pool
#            only for tests that actually exercise edge APIs (recommended)
#         b) add `tiny-warning` to deps.optimizer.ssr.include in vitest.config
#         c) alias tiny-warning to an ESM shim via vite resolve.alias
#
#   • packages/embed Playwright e2e tests
#       Status: not run in CI yet. Needs `pnpm exec playwright install` step
#       and a separate job (slower, browser-based). Add when we want
#       end-to-end coverage of the embeddable widget.
#
#   • Cloudflare Container apps (apps/compiler, apps/verifier)
#       Status: no automated tests today. Both run inside Workerd Containers
#       and require Docker for local builds. A real smoke test would deploy
#       to a preview environment and curl the /verify and /compile endpoints.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: core+ui tests, workspace build, web build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        # Version inferred from `packageManager` in package.json
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: pnpm --filter @simten/core test

      - name: Run ui tests
        run: pnpm --filter @simten/ui test

      - name: Build workspace packages
        # @simten/web imports `@simten/core/circuit`, `@simten/ui`, `@simten/embed`
        # via their `exports` map → `./dist/...`. Without this step, fresh CI
        # checkouts have no dist and the web app build fails to resolve.
        #
        # `--workspace-concurrency=1` forces sequential builds so @simten/mcp
        # doesn't race ahead of @simten/core. pnpm doesn't enforce topological
        # ordering for `run` scripts by default — see issue tracker for plans
        # to evaluate turbo / nx / lage as a proper build orchestrator.
        run: pnpm --filter "./packages/*" --workspace-concurrency=1 build

      - name: Build web app
        run: pnpm --filter @simten/web build
