# cc65 linker configuration for the 6502 computer in the "From NAND to a 6502"
# blog post (apps/web/src/features/blog/building-a-cpu/computer6502.circuit.ts).
#
#   $0000-$00FF  zero page (RAM)
#   $0100-$01FF  hardware stack (RAM)
#   $0200-$07FF  RAM: variables, then cc65's C stack growing down from $0800
#   $C000-$FFFF  ROM: program, data and vectors
#   $F000        console (writes print a character; reads see the ROM)

MEMORY {
    ZP:      start = $0002, size = $00FE, type = rw, define = yes;
    STACK:   start = $0100, size = $0100, type = rw, define = yes;
    RAM:     start = $0200, size = $0600, type = rw, define = yes;
    ROM:     start = $C000, size = $4000, type = ro, define = yes, fill = yes;
}

SEGMENTS {
    ZEROPAGE: load = ZP,      type = zp;
    STACK:    load = STACK,   type = bss, optional = yes;
    BSS:      load = RAM,     type = bss, define = yes;
    DATA:     load = ROM,     type = rw,  run = RAM, define = yes;
    ONCE:     load = ROM,     type = ro,  optional = yes;
    RODATA:   load = ROM,     type = ro;
    CODE:     load = ROM,     type = ro;
    VECTORS:  load = ROM,     type = ro, start = $FFFA;
}

FEATURES {
    CONDES: type = constructor, label = __CONSTRUCTOR_TABLE__,
            count = __CONSTRUCTOR_COUNT__, segment = ONCE;
    CONDES: type = destructor, label = __DESTRUCTOR_TABLE__,
            count = __DESTRUCTOR_COUNT__, segment = RODATA;
}
