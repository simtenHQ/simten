<!doctype html>
<!--
  Source for public/og-default.png, the social card.

  Identical to apps/game/scripts/og-card.html, and deliberately so: simten.dev
  and play.simten.dev share one card. The two links are almost never seen side
  by side, and the title and description say which is which.

  The card carries no words. WhatsApp, iMessage and compact Slack render it as
  a small thumbnail rather than a banner, and a tagline set small enough to fit
  the layout is unreadable once shrunk that far. The mark survives the shrink;
  a sentence does not. Copy belongs in the title and description, which those
  clients render at full size beside it.

  To re-render, from the repo root:

    cd apps/web/public && python3 -m http.server 3012 &
    cp ../scripts/og-card.html ./__og.html
    # open http://localhost:3012/__og.html at exactly 1200x630, screenshot it
    rm __og.html

  The viewport must be exactly 1200x630 or the lockup renders off-centre in a
  taller frame. The lockup is centred on its ink rather than its box; see the
  transform below.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Geist';
    src: url('/fonts/Geist-Variable.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0a0a0a;
    font-family: 'Geist', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
  }
  /*
    Centred on the ink, not on the box. The mark's viewBox keeps a little empty
    space on its left and the wordmark's line box carries ascender and descender
    room, so flex centring alone lands 17px right and 2px high. Measured off the
    rendered pixels, not guessed.
  */
  .lockup { display: flex; align-items: center; gap: 44px; color: #f5f5f5; transform: translate(-8px, 2px); }
  .word { font-size: 187px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
</style>
</head>
<body>
  <div class="lockup">
    <svg width="386" height="275" viewBox="8 8 28 20" fill="none" aria-hidden="true">
      <g transform="translate(10 25.694) rotate(0 11.873 -7.845)">
        <path
          d="M0 0 C1.18 -0.01, 2.35 -0.02, 5.8 -0.06 M0 0 C1.61 -0.02, 3.22 -0.03, 5.8 -0.06 M5.8 -0.06 C5.74 -3.55, 5.69 -7.05, 5.55 -15.47 M5.8 -0.06 C5.71 -5.37, 5.63 -10.69, 5.55 -15.47 M5.55 -15.47 C7.29 -15.52, 9.04 -15.56, 10.89 -15.61 M5.55 -15.47 C7.33 -15.52, 9.11 -15.56, 10.89 -15.61 M10.89 -15.61 C11.01 -10.54, 11.14 -5.48, 11.27 -0.05 M10.89 -15.61 C10.98 -11.9, 11.07 -8.18, 11.27 -0.05 M11.27 -0.05 C12.44 -0.1, 13.62 -0.15, 14.43 -0.19 M11.27 -0.05 C12.44 -0.1, 13.6 -0.15, 14.43 -0.19 M14.43 -0.19 C14.5 -5.45, 14.56 -10.71, 14.61 -15.56 M14.43 -0.19 C14.5 -5.98, 14.57 -11.77, 14.61 -15.56 M14.61 -15.56 C15.28 -15.6, 15.95 -15.64, 16.44 -15.67 M14.61 -15.56 C14.99 -15.58, 15.37 -15.6, 16.44 -15.67 M16.44 -15.67 C16.45 -12.31, 16.46 -8.95, 16.48 -0.15 M16.44 -15.67 C16.46 -10.45, 16.47 -5.22, 16.48 -0.15 M16.48 -0.15 C16.84 -0.14, 17.2 -0.12, 18.01 -0.08 M16.48 -0.15 C16.95 -0.13, 17.42 -0.11, 18.01 -0.08 M18.01 -0.08 C18.06 -5.22, 18.11 -10.35, 18.17 -15.61 M18.01 -0.08 C18.07 -5.97, 18.13 -11.85, 18.17 -15.61 M18.17 -15.61 C18.75 -15.64, 19.32 -15.66, 20.13 -15.69 M18.17 -15.61 C18.67 -15.63, 19.18 -15.66, 20.13 -15.69 M20.13 -15.69 C20.17 -12.42, 20.2 -9.15, 20.3 0 M20.13 -15.69 C20.19 -10.25, 20.25 -4.81, 20.3 0 M20.3 0 C21.52 0, 22.73 0, 23.75 0 M20.3 0 C21.27 0, 22.23 0, 23.75 0"
          stroke="currentColor" stroke-width="1" stroke-linecap="round" fill="none" />
      </g>
    </svg>
    <span class="word">Simten</span>
  </div>
</body>
</html>
