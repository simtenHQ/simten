<!doctype html>
<!--
  Source for public/og-default.png, the social card.

  Kept because the card is otherwise an opaque binary that nobody can edit: to
  change the tagline, edit this file and re-render. It lives here rather than in
  public/ so it is not served at play.simten.dev/og-card.html.

  To re-render, from the repo root with the game dev server running:

    cp apps/game/scripts/og-card.html apps/game/public/__og.html
    # open http://localhost:3003/__og.html at exactly 1200x630 and screenshot it
    rm apps/game/public/__og.html

  Sizes are matched to apps/web/public/og-default.png so the two cards read as
  siblings when someone sees both links: #0a0a0a ground, #f5f5f5 mark, #a3a3a3
  tagline, and the same lockup scale.
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<style>
  @font-face {
    font-family: 'Geist';
    src: url('/fonts/Geist-Variable.woff2') format('woff2');
    font-weight: 100 900;
    font-display: block;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    background: #0a0a0a;
    font-family: 'Geist', -apple-system, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 56px;
  }
  .lockup { display: flex; align-items: center; gap: 37px; color: #f5f5f5; }
  .word { font-size: 158px; font-weight: 600; letter-spacing: -0.045em; line-height: 1; }
  .tag { font-size: 38px; font-weight: 400; color: #a3a3a3; letter-spacing: -0.01em; }
</style>
</head>
<body>
  <div class="lockup">
    <svg width="327" height="233" viewBox="8 8 28 20" fill="none" aria-hidden="true">
      <g transform="translate(10 25.694) rotate(0 11.873 -7.845)">
